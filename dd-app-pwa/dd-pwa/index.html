<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="description" content="DD — decide or die. A fast, friendly decision-making app.">

<!-- PWA manifest -->
<link rel="manifest" href="/manifest.json">

<!-- iOS "Add to Home Screen" support (Safari ignores manifest.json for most of this) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DD">
<link rel="apple-touch-icon" href="/icons/icon-180.png">

<!-- Android/Chrome icon -->
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">

<title>DD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div id="app">
  <header id="top"><div class="brand"><span>DD</span></div></header>
  <main id="main"><div class="splash"></div></main>
  <nav id="nav"></nav>
  <div id="modal"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="/src/app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
